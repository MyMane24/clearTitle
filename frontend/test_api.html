<!DOCTYPE html>
<html><body>
<h2>API Test</h2>
<pre id="out">Loading...</pre>
<script>
(async function(){
  try {
    const r = await fetch("/api/cases");
    const data = await r.json();
    document.getElementById("out").textContent = JSON.stringify({total: data.total, cases: data.cases?.length}, null, 2);
  } catch(e) {
    document.getElementById("out").textContent = "ERROR: " + e.message;
  }
})();
</script>
</body></html>
