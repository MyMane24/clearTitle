[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Endemic patterns inherited from the verbatim-copied persistence/integration
# code (blind excepts, line length, guarded best-effort Redis/DB calls).
"backend/database/*" = ["BLE001", "S110", "S608", "E501"]
"backend/database/repositories/*" = ["BLE001", "S110", "S608", "E501"]
"backend/integrations/*" = ["BLE001", "S110", "S608", "S324", "S311", "E741", "N806", "E402", "E501", "F841"]
"backend/workers/*" = ["BLE001", "S110", "E501", "N818", "F841"]
"backend/routers/*" = ["BLE001", "E501"]
"backend/services/*" = ["S", "BLE001", "E501", "RUF059"]
"backend/domain/*" = ["E501"]
"backend/config.py" = ["E501"]
"backend/main.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
extraPaths = ["."]

